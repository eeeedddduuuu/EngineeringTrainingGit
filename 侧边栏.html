<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>侧边栏设计参考</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fb;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 1px solid #e8ecf1;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 20px 16px;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px 28px 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4F8CF7, #7C6FF7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #1a2332;
        }
        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 12px 24px 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #4F46E5;
        }
        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a2332;
        }
        .user-role {
            font-size: 12px;
            color: #8c95a6;
        }
        .sidebar-nav {
            flex: 1;
            padding: 20px 0 12px 0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            color: #4a5366;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            margin-bottom: 2px;
        }
        .nav-item:hover {
            background: #f0f4fe;
            color: #1a2332;
        }
        .nav-item.active {
            background: #eef2ff;
            color: #4F46E5;
            font-weight: 600;
        }
        .nav-item .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .sidebar-footer {
            border-top: 1px solid #f0f2f5;
            padding-top: 16px;
            margin-top: auto;
        }
        .nav-item.logout {
            color: #b91c1c;
            font-weight: 500;
        }
        .nav-item.logout:hover {
            background: #fef2f2;
            color: #991b1b;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            background: #f8fafc;
        }
        .main-content h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a2332;
        }
        .main-content p {
            color: #5a6378;
            margin-top: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">✦</div>
            <span class="brand-name">AI 创作助手</span>
        </div>
        <div class="sidebar-user">
            <div class="user-avatar">C</div>
            <div class="user-info">
                <span class="user-name">Claude 用户</span>
                <span class="user-role">创作者 · 已登录</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">📊</span> 工作台
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📋</span> 历史记录
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📈</span> 数据看板
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙️</span> 设置
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item logout">
                <span class="nav-icon">🚪</span> 退出登录
            </a>
        </div>
    </aside>
    <main class="main-content">
        <h1>👋 欢迎回来，Claude</h1>
        <p>这是侧边栏字体 & 间距的设计参考。</p>
    </main>
</body>
</html>
